name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: pdm-project/setup-pdm@v4
        with:
          version: 2.26.9
          cache: true
      - run: pdm sync --frozen-lockfile -G dev
      - run: pdm run check

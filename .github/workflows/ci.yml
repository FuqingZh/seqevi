name: CI

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seqevi
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seqevi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PDM_USE_PYTHON_VERSION: "false"
      SEQEVI_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/seqevi
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: pdm-project/setup-pdm@v4
        with:
          version: 2.26.9
          python-version: ${{ matrix.python-version }}
          cache: true
      - run: pdm install --frozen-lockfile -G dev -G server
      - name: Verify matrix interpreter
        env:
          EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          test "$(pdm run python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "${EXPECTED_PYTHON_VERSION}"
      - run: pdm run check

  distribution-and-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seqevi_image
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seqevi_image"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: pdm-project/setup-pdm@v4
        with:
          version: 2.26.9
          python-version: "3.13"
          cache: true
      - run: pdm install --frozen-lockfile -G dev -G server
      - run: pdm build
      - name: Install and inspect clean wheel
        run: |
          project_version="$(pdm show --version)"
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_path}"
          python -m venv /tmp/seqevi-wheel
          /tmp/seqevi-wheel/bin/pip install "${wheel_path}[server]"
          /tmp/seqevi-wheel/bin/pip check
          test "$(/tmp/seqevi-wheel/bin/seqevi --version)" = "${project_version}"
          /tmp/seqevi-wheel/bin/seqevi serve --help
      - name: Build and inspect service image
        run: |
          project_version="$(pdm show --version)"
          docker build --tag seqevi:ci .
          test "$(docker image inspect seqevi:ci --format '{{.Config.User}}')" = "seqevi"
          docker run --rm seqevi:ci --version | grep -Fx "${project_version}"
          docker run --rm --entrypoint python seqevi:ci -c \
            "import importlib.util; assert importlib.util.find_spec('seqevi'); assert importlib.util.find_spec('fastapi'); assert importlib.util.find_spec('psycopg')"
          docker run --rm --entrypoint sh seqevi:ci -c \
            "! command -v emapper.py && ! command -v interproscan.sh && ! test -e /opt/eggnog && ! test -e /opt/interproscan && ! test -e /data/eggnog && ! test -e /data/interproscan"
      - name: Verify migration, health, and restart
        env:
          SEQEVI_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:15432/seqevi_image
        run: |
          artifacts_dir="$(mktemp -d)"
          chmod 0777 "${artifacts_dir}"
          docker run --detach --name seqevi-ci --network host \
            --mount "type=bind,src=${artifacts_dir},dst=/var/lib/seqevi/artifacts" \
            --env SEQEVI_DATABASE_URL \
            --env SEQEVI_ARTIFACTS_DIR=/var/lib/seqevi/artifacts \
            --env SEQEVI_HEALTH_URL=http://127.0.0.1:18081/health \
            seqevi:ci serve --host 127.0.0.1 --port 18081
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18081/health && break
            test "${attempt}" -lt 30
            sleep 1
          done
          expected_revision="$(docker run --rm --entrypoint python seqevi:ci -c \
            'from seqevi.store.migration import _CURRENT_REVISION; print(_CURRENT_REVISION)')"
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -d seqevi_image -Atc \
            "select version_num from alembic_version" \
            | grep -Fx "${expected_revision}"
          docker restart seqevi-ci
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18081/health && break
            test "${attempt}" -lt 30
            sleep 1
          done

  dbcan-runtime-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pdm-project/setup-pdm@v4
        with:
          version: 2.26.9
          python-version: "3.13"
          cache: true
      - run: pdm build
      - name: Read project version
        id: dbcan-project
        run: echo "version=$(pdm show --version)" >> "${GITHUB_OUTPUT}"
      - name: Prepare wheel context
        run: |
          mkdir -p "${RUNNER_TEMP}/seqevi-wheel"
          cp dist/seqevi-${{ steps.dbcan-project.outputs.version }}-*.whl "${RUNNER_TEMP}/seqevi-wheel/"
          cp LICENSE "${RUNNER_TEMP}/seqevi-wheel/LICENSE"
      - uses: docker/setup-buildx-action@v4
      - name: Build Linux/amd64 runtime image
        uses: docker/build-push-action@v7
        with:
          context: containers/dbcan
          file: containers/dbcan/Dockerfile
          build-contexts: |
            seqevi-wheel=${{ runner.temp }}/seqevi-wheel
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.dbcan-project.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: seqevi-dbcan:ci
      - name: Inspect runtime contract
        run: |
          project_version="$(pdm show --version)"
          docker run --rm --entrypoint /opt/venv/bin/seqevi seqevi-dbcan:ci --version | grep -Fx "${project_version}"
          docker run --rm --entrypoint /opt/dbcan-venv/bin/run_dbcan seqevi-dbcan:ci version | grep -F '5.2.9'
          docker run --rm --entrypoint diamond seqevi-dbcan:ci version | grep -F '2.1.15'
          docker run --rm --entrypoint sh seqevi-dbcan:ci -c \
            'test -s /usr/share/seqevi/compliance/NOTICE && test -s /usr/share/seqevi/compliance/SOURCE-CORRESPONDENCE.md'
          docker run --rm --entrypoint sh seqevi-dbcan:ci -c \
            '! find / -xdev -type f \( -name CAZy.dmnd -o -name dbCAN.hmm -o -name dbCAN-sub.hmm -o -name fam-substrate-mapping.tsv \) -print -quit | grep .'

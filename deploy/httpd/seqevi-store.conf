# FUQ-22 node4 private-cluster ingress.
# Certificate/key and htpasswd material are external deployment secrets.
Listen 192.168.30.205:18443 https

<VirtualHost 192.168.30.205:18443>
    ServerName node4.cluster.local

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/seqevi-store.crt
    SSLCertificateKeyFile /etc/pki/tls/private/seqevi-store.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyRequests Off
    ProxyPreserveHost Off
    ProxyPass / http://127.0.0.1:18081/ nocanon
    ProxyPassReverse / http://127.0.0.1:18081/

    RequestHeader unset Forwarded
    RequestHeader unset Authorization
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto

    <Location />
        AuthType Basic
        AuthName "SeqEvi private Store"
        AuthBasicProvider file
        AuthUserFile /etc/seqevi/ingress.htpasswd

        <RequireAll>
            Require ip 172.17.0.0/16 192.168.30.0/24
            Require valid-user
        </RequireAll>
    </Location>
</VirtualHost>
